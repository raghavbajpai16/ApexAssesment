services:
  mysql:
    image: mysql:8.0
    container_name: apex_tape_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: apex_tape_stock
      MYSQL_USER: tape_user
      MYSQL_PASSWORD: tape_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
